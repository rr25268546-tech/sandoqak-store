<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SANDOQAK | صندوقك</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #090909;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #00e5ff;
        }

        .cart {
            background: #151515;
            padding: 10px 15px;
            border-radius: 12px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .emoji {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #00e5ff;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #00e5ff;
            color: #000;
            padding: 15px 30px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        .drop {
            margin: 20px;
            padding: 25px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 20px;
            text-align: center;
        }

        .drop h2 {
            margin-bottom: 10px;
        }

        .drop p {
            color: #aaa;
            margin: 10px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin: 20px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .hero {
                padding: 60px 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        SANDOQ<span>AK</span> 🎁
    </div>

    <div class="cart">
        🛒 0
    </div>

</header>


<section class="hero">

    <div class="emoji">
        🎁
    </div>

    <h1>
        مش هتعرف إيه جوه
        <span>الصندوق</span>
    </h1>

    <p>
        اختار مغامرتك وسيب الباقي علينا.
        <br>
        افتح الصندوق... واكتشف المفاجأة 😈
    </p>

    <a href="store.html" class="button">
        اكتشف صناديقك 🔥
    </a>

</section>


<section class="drop">

    <h2>
        🔥 DROP #001
    </h2>

    <p>
        صندوق غامض محدود العدد
    </p>

    <div class="price">
        349 جنيه
    </div>

    <p>
        📦 100 صندوق فقط
    </p>

    <a href="store.html" class="button">
        اطلب الآن 🛒
    </a>

</section>


<footer>

    SANDOQAK © 2026

    <br>

    تجربة مختلفة... كل مرة.

</footer>

</body>

</html>
