<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إتمام الطلب | صندوقك</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #090909;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .title {
            text-align: center;
            margin: 20px 0 25px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .title p {
            color: #aaa;
        }

        .box {
            background: #111;
            border: 1px solid #252525;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .box h2 {
            margin-bottom: 18px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid #252525;
            gap: 10px;
        }

        .product:last-child {
            border-bottom: none;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 21px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #181818;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #00e5ff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .confirm {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #00e5ff;
            color: #000;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .confirm:active {
            transform: scale(.98);
        }

        .back {
            display: block;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 25px 10px;
        }

        .success {
            display: none;
            text-align: center;
            background: #111;
            border: 1px solid #252525;
            border-radius: 20px;
            padding: 30px 20px;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .success h2 {
            margin-bottom: 10px;
        }

        .success p {
            color: #aaa;
            line-height: 1.7;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .title h1 {
                font-size: 26px;
            }

            .box {
                padding: 16px;
            }

            .product {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- العنوان -->

    <div class="title">

        <h1>
            📦 إتمام الطلب
        </h1>

        <p>
            راجع طلبك واكتب بيانات التوصيل
        </p>

    </div>


    <!-- ملخص الطلب -->

    <div class="box">

        <h2>
            🛒 طلبك
        </h2>

        <div id="orderItems"></div>

        <div class="total">

            <span>
                الإجمالي
            </span>

            <span>

                <span id="orderTotal">
                    0
                </span>

                جنيه

            </span>

        </div>

    </div>


    <!-- بيانات العميل -->

    <div class="box" id="customerBox">

        <h2>
            👤 بيانات العميل
        </h2>


        <form id="orderForm">


            <label>
                الاسم
            </label>

            <input
                type="text"
                id="name"
                placeholder="اكتب اسمك"
                required
            >


            <label>
                رقم الهاتف
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="01xxxxxxxxx"
                required
            >


            <label>
                العنوان
            </label>

            <textarea
                id="address"
                placeholder="اكتب عنوان التوصيل بالتفصيل"
                required
            ></textarea>


            <button
                type="submit"
                class="confirm">

                تأكيد الطلب 🚀

            </button>


        </form>

    </div>


    <!-- رسالة نجاح -->

    <div
        class="success"
        id="successBox">

        <div class="success-icon">
            🎉
        </div>

        <h2>
            تم تأكيد طلبك!
        </h2>

        <p>
            شكرًا ليك ❤️
            <br>
            طلبك اتسجل بنجاح.
        </p>

    </div>


    <!-- العودة للمتجر -->

    <a
        href="store.html"
        class="back">

        ← العودة للمتجر

    </a>


</div>


<script>


/* =========================
   تحميل السلة
========================= */

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


/* =========================
   عناصر الصفحة
========================= */

const orderItems =
    document.getElementById("orderItems");

const orderTotal =
    document.getElementById("orderTotal");

const orderForm =
    document.getElementById("orderForm");

const customerBox =
    document.getElementById("customerBox");

const successBox =
    document.getElementById("successBox");


/* =========================
   حساب وعرض الطلب
========================= */

let total = 0;


if (cart.length === 0) {

    orderItems.innerHTML = `

        <div class="empty">

            السلة فاضية 🛒

            <br><br>

            ارجع للمتجر وأضف صندوقًا أولًا.

        </div>

    `;

} else {


    cart.forEach(function(item) {


        const price =
            Number(item.price) || 0;


        total += price;


        orderItems.innerHTML += `

            <div class="product">

                <span>
                    ${item.name}
                </span>

                <strong>
                    ${price} جنيه
                </strong>

            </div>

        `;

    });

}


orderTotal.innerText = total;


/* =========================
   تأكيد الطلب
========================= */

orderForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* التأكد من وجود منتجات */

        if (cart.length === 0) {

            alert(
                "السلة فاضية 🛒"
            );

            return;

        }


        /* بيانات العميل */

        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const address =
            document
            .getElementById("address")
            .value
            .trim();


        /* التأكد من البيانات */

        if (
            name === "" ||
            phone === "" ||
            address === ""
        ) {

            alert(
                "من فضلك اكتب كل البيانات المطلوبة ⚠️"
            );

            return;

        }


        /* إنشاء رقم للطلب */

        const orderId =
            Date.now();


        /* إنشاء الطلب */

        const order = {

            id: orderId,

            name: name,

            phone: phone,

            address: address,

            products: cart,

            total: total,

            date:
                new Date()
                .toLocaleString("ar-EG")

        };


        /* =========================
           جلب الطلبات القديمة
        ========================= */

        let orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];


        /* إضافة الطلب الجديد */

        orders.push(order);


        /* حفظ كل الطلبات */

        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );


        /* حفظ آخر طلب */

        localStorage.setItem(
            "lastOrder",
            JSON.stringify(order)
        );


        /* تفريغ السلة */

        localStorage.removeItem(
            "cart"
        );


        /* إخفاء نموذج البيانات */

        customerBox.style.display =
            "none";


        /* إظهار رسالة النجاح */

        successBox.style.display =
            "block";


        /* رسالة نجاح */

        alert(
            "تم تأكيد طلبك بنجاح 🎉"
        );


        /* بعد ثانيتين نرجع للرئيسية */

        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            2000
        );

    }
);


</script>


</body>

</html>
