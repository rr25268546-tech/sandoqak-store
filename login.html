<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SANDOQAK | تسجيل الدخول</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#090909;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#ccc;
}

input{
    width:100%;
    height:48px;
    background:#181818;
    border:1px solid #333;
    border-radius:10px;
    color:#fff;
    padding:12px;
    font-size:16px;
    outline:none;
    margin-bottom:15px;
}

input:focus{
    border-color:#00e5ff;
}

button{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.send{
    background:#00e5ff;
    color:#000;
}

.verify{
    background:#22c55e;
    color:#fff;
    margin-top:10px;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#codeBox{
    display:none;
}

#message{
    margin-top:15px;
    text-align:center;
    line-height:1.6;
    min-height:25px;
}

.error{
    color:#ff7777;
}

.success{
    color:#6dff91;
}

.info{
    color:#ccc;
}

#recaptcha-container{
    margin:15px 0;
    display:flex;
    justify-content:center;
}

</style>
</head>

<body>

<div class="box">

    <h1>📦 SANDOQAK</h1>

    <p class="subtitle">
        تسجيل الدخول أو إنشاء حساب
    </p>

    <label for="phone">
        رقم الهاتف
    </label>

    <input
        id="phone"
        type="tel"
        placeholder="مثال: 01012345678"
        autocomplete="tel"
    >

    <div id="recaptcha-container"></div>

    <button
        id="sendBtn"
        class="send"
        type="button"
    >
        إرسال كود التحقق 📱
    </button>

    <div id="codeBox">

        <label
            for="code"
            style="margin-top:20px;"
        >
            كود التحقق
        </label>

        <input
            id="code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="أدخل الكود"
            autocomplete="one-time-code"
        >

        <button
            id="verifyBtn"
            class="verify"
            type="button"
        >
            تأكيد الكود ✅
        </button>

    </div>

    <div id="message"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3NvbBmiX-2nBBFw-X6KBkpU_8ZOQnDvQ",

    authDomain:
    "sandoqak-479c4.firebaseapp.com",

    projectId:
    "sandoqak-479c4",

    storageBucket:
    "sandoqak-479c4.firebasestorage.app",

    messagingSenderId:
    "295608980009",

    appId:
    "1:295608980009:web:f3176896d1b5f461c30238"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const phoneInput =
    document.getElementById("phone");

const codeInput =
    document.getElementById("code");

const sendBtn =
    document.getElementById("sendBtn");

const verifyBtn =
    document.getElementById("verifyBtn");

const codeBox =
    document.getElementById("codeBox");

const message =
    document.getElementById("message");


let confirmationResult = null;
let recaptchaVerifier = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.className = type || "";

    message.innerText = text;

}


/* =========================
   FORMAT EGYPT PHONE
========================= */

function formatEgyptPhone(phone){

    phone =
        phone
        .replace(/\s+/g,"")
        .replace(/-/g,"");


    if(phone.startsWith("01")){

        return "+20" + phone.substring(1);

    }


    if(phone.startsWith("0020")){

        return "+" + phone.substring(2);

    }


    if(phone.startsWith("+20")){

        return phone;

    }


    return phone;

}


/* =========================
   CREATE RECAPTCHA
========================= */

function createRecaptcha(){

    if(recaptchaVerifier){

        try{
            recaptchaVerifier.clear();
        }catch(e){}

    }


    recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size:"normal"
            }
        );

}


/* =========================
   INITIALIZE
========================= */

createRecaptcha();


/* =========================
   CHECK LOGIN
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){
            return;
        }


        /*
           العميل مسجل بالفعل.
           نتأكد فقط من وجود بياناته.
        */

        try{

            const customerRef =
                doc(
                    db,
                    "customers",
                    user.uid
                );

            const customerSnap =
                await getDoc(customerRef);


            if(!customerSnap.exists()){

                await setDoc(

                    customerRef,

                    {
                        uid:user.uid,

                        phone:user.phoneNumber || "",

                        points:0,

                        totalPurchases:0,

                        createdAt:
                            serverTimestamp()

                    }

                );

            }


            showMessage(
                "✅ أنت مسجل بالفعل، جاري فتح المتجر...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                800
            );


        }catch(error){

            console.error(error);

            showMessage(
                "تم تسجيل الدخول، لكن حدث خطأ أثناء تحميل بيانات الحساب.",
                "error"
            );

        }

    }
);


/* =========================
   SEND OTP
========================= */

sendBtn.addEventListener(
    "click",
    async function(){

        const phone =
            formatEgyptPhone(
                phoneInput.value.trim()
            );


        if(
            !/^\+20\d{10}$/.test(phone)
        ){

            showMessage(
                "❌ اكتب رقم مصري صحيح مثل 01012345678",
                "error"
            );

            return;

        }


        sendBtn.disabled = true;

        sendBtn.innerText =
            "جاري إرسال الكود...";


        try{

            if(!recaptchaVerifier){

                createRecaptcha();

            }


            confirmationResult =
                await signInWithPhoneNumber(
                    auth,
                    phone,
                    recaptchaVerifier
                );


            codeBox.style.display =
                "block";


            showMessage(
                "✅ تم إرسال كود التحقق إلى هاتفك.",
                "success"
            );


            sendBtn.innerText =
                "تم إرسال الكود";


        }catch(error){

            console.error(error);


            let errorMessage =
                "❌ لم نتمكن من إرسال الكود.";


            if(
                error.code ===
                "auth/invalid-phone-number"
            ){

                errorMessage =
                    "❌ رقم الهاتف غير صحيح.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                errorMessage =
                    "❌ تم طلب أكواد كثيرة. حاول لاحقًا.";

            }

            else if(
                error.code ===
                "auth/quota-exceeded"
            ){

                errorMessage =
                    "❌ تم تجاوز حد الرسائل المتاح حاليًا.";

            }

            else if(
                error.code ===
                "auth/captcha-check-failed"
            ){

                errorMessage =
                    "❌ فشل التحقق الأمني. أعد تحميل الصفحة وحاول مرة أخرى.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            sendBtn.disabled =
                false;

            sendBtn.innerText =
                "إرسال كود التحقق 📱";


            createRecaptcha();

        }

    }
);


/* =========================
   VERIFY OTP
========================= */

verifyBtn.addEventListener(
    "click",
    async function(){

        if(!confirmationResult){

            showMessage(
                "❌ اطلب كود التحقق أولًا.",
                "error"
            );

            return;

        }


        const code =
            codeInput.value.trim();


        if(!/^\d{6}$/.test(code)){

            showMessage(
                "❌ أدخل كود التحقق المكون من 6 أرقام.",
                "error"
            );

            return;

        }


        verifyBtn.disabled =
            true;

        verifyBtn.innerText =
            "جاري التحقق...";


        try{

            const result =
                await confirmationResult.confirm(code);


            const user =
                result.user;


            const customerRef =
                doc(
                    db,
                    "customers",
                    user.uid
                );


            const customerSnap =
                await getDoc(customerRef);


            /*
               إنشاء بيانات العميل
               لأول مرة فقط.
            */

            if(!customerSnap.exists()){

                await setDoc(

                    customerRef,

                    {
                        uid:user.uid,

                        phone:user.phoneNumber || "",

                        points:0,

                        totalPurchases:0,

                        createdAt:
                            serverTimestamp()

                    }

                );

            }


            showMessage(
                "🎉 تم تسجيل الدخول بنجاح! جاري فتح المتجر...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                1000
            );


        }catch(error){

            console.error(error);


            let errorMessage =
                "❌ كود التحقق غير صحيح أو انتهت صلاحيته.";


            if(
                error.code ===
                "auth/invalid-verification-code"
            ){

                errorMessage =
                    "❌ كود التحقق غير صحيح.";

            }

            else if(
                error.code ===
                "auth/code-expired"
            ){

                errorMessage =
                    "❌ انتهت صلاحية الكود. اطلب كودًا جديدًا.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            verifyBtn.disabled =
                false;

            verifyBtn.innerText =
                "تأكيد الكود ✅";

        }

    }
);

</script>

</body>

</html>
