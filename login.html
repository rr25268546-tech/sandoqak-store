<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SANDOQAK | الحساب</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#090909;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#ccc;
}

input{
    width:100%;
    height:48px;
    background:#181818;
    border:1px solid #333;
    border-radius:10px;
    color:#fff;
    padding:12px;
    font-size:16px;
    outline:none;
    margin-bottom:14px;
}

input:focus{
    border-color:#00e5ff;
}

button{
    border:0;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.main-btn{
    width:100%;
    height:48px;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
}

.register-btn{
    width:100%;
    height:48px;
    border-radius:10px;
    background:#22c55e;
    color:#fff;
}

.switch-btn{
    width:100%;
    background:transparent;
    color:#00e5ff;
    margin-top:15px;
    padding:8px;
}

#registerBox{
    display:none;
}

.other-title{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:20px;
    margin-bottom:13px;
}

.social-options{
    display:flex;
    justify-content:center;
    align-items:center;
}

.social-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    transition:.2s;
    border:1px solid #333;
}

.social-btn:hover{
    transform:translateY(-3px);
    border-color:#777;
}

.google-circle{
    background:#fff;
    color:#4285F4;
}

#recaptcha-box{
    margin:12px 0;
    padding:10px;
    border:1px solid #292929;
    border-radius:10px;
    background:#0d0d0d;
    color:#777;
    font-size:12px;
    text-align:center;
}

#message{
    margin-top:15px;
    text-align:center;
    line-height:1.6;
    min-height:25px;
    word-break:break-word;
}

.error{
    color:#ff7777;
}

.success{
    color:#6dff91;
}

.info{
    color:#ccc;
}

.small{
    color:#777;
    font-size:12px;
    text-align:center;
    margin-top:15px;
    line-height:1.6;
}

</style>
</head>

<body>

<div class="box">

    <h1>📦 SANDOQAK</h1>

    <p class="subtitle">
        تسجيل الدخول أو إنشاء حساب
    </p>


    <!-- =========================
         LOGIN
    ========================== -->

    <div id="loginBox">

        <label for="loginPhone">
            رقم الهاتف المصري
        </label>

        <input
            id="loginPhone"
            type="tel"
            placeholder="01012345678"
            autocomplete="tel"
            inputmode="numeric"
        >


        <label for="loginPassword">
            كلمة المرور
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >


        <!-- reCAPTCHA للحماية فقط -->
        <div id="recaptcha-box">
            🛡️ سيتم استخدام الحماية ضد الطلبات الآلية فقط
        </div>


        <button
            id="loginBtn"
            class="main-btn"
            type="button"
        >
            تسجيل الدخول 🔐
        </button>


        <button
            id="showRegisterBtn"
            class="switch-btn"
            type="button"
        >
            ليس لديك حساب؟ إنشاء حساب جديد
        </button>

    </div>


    <!-- =========================
         REGISTER
    ========================== -->

    <div id="registerBox">

        <label for="registerName">
            الاسم
        </label>

        <input
            id="registerName"
            type="text"
            placeholder="اكتب اسمك"
            autocomplete="name"
        >


        <label for="registerPhone">
            رقم الهاتف المصري
        </label>

        <input
            id="registerPhone"
            type="tel"
            placeholder="01012345678"
            autocomplete="tel"
            inputmode="numeric"
        >


        <label for="registerEmail">
            البريد الإلكتروني
        </label>

        <input
            id="registerEmail"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
        >


        <label for="registerPassword">
            كلمة المرور
        </label>

        <input
            id="registerPassword"
            type="password"
            placeholder="6 أحرف أو أكثر"
            autocomplete="new-password"
        >


        <label for="registerPassword2">
            تأكيد كلمة المرور
        </label>

        <input
            id="registerPassword2"
            type="password"
            placeholder="أعد كتابة كلمة المرور"
            autocomplete="new-password"
        >


        <div id="recaptcha-register-box">
            🛡️ حماية التسجيل من الاستخدام الآلي
        </div>


        <button
            id="registerBtn"
            class="register-btn"
            type="button"
        >
            إنشاء الحساب 🎁
        </button>


        <button
            id="showLoginBtn"
            class="switch-btn"
            type="button"
        >
            لديك حساب بالفعل؟ تسجيل الدخول
        </button>

    </div>


    <!-- =========================
         GOOGLE
    ========================== -->

    <div class="other-title">
        أو الدخول باستخدام
    </div>


    <div class="social-options">

        <button
            id="googleBtn"
            class="social-btn google-circle"
            type="button"
            title="Google"
        >
            G
        </button>

    </div>


    <p class="small">

        📱 رقم الهاتف بيانات أساسية للعميل.

        <br>

        📧 البريد الإلكتروني يستخدم للمصادقة.

        <br>

        🎁 النقاط والمشتريات محفوظة ولن يتم تصفيرها.

    </p>


    <div id="message"></div>

</div>


<script type="module">


/* =========================================
   FIREBASE APP
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* =========================================
   FIREBASE AUTH
========================================= */

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIRESTORE
========================================= */

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3NvbBmiX-2nBBFw-X6KBkpU_8ZOQnDvQ",

    authDomain:
    "sandoqak-479c4.firebaseapp.com",

    projectId:
    "sandoqak-479c4",

    storageBucket:
    "sandoqak-479c4.firebasestorage.app",

    messagingSenderId:
    "295608980009",

    appId:
    "1:295608980009:web:f3176896d1b5f461c30238"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================
   ELEMENTS
========================================= */

const loginBox =
    document.getElementById("loginBox");

const registerBox =
    document.getElementById("registerBox");

const loginPhone =
    document.getElementById("loginPhone");

const loginPassword =
    document.getElementById("loginPassword");

const registerName =
    document.getElementById("registerName");

const registerPhone =
    document.getElementById("registerPhone");

const registerEmail =
    document.getElementById("registerEmail");

const registerPassword =
    document.getElementById("registerPassword");

const registerPassword2 =
    document.getElementById("registerPassword2");

const loginBtn =
    document.getElementById("loginBtn");

const registerBtn =
    document.getElementById("registerBtn");

const googleBtn =
    document.getElementById("googleBtn");

const showRegisterBtn =
    document.getElementById("showRegisterBtn");

const showLoginBtn =
    document.getElementById("showLoginBtn");

const message =
    document.getElementById("message");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.textContent =
        text;

    message.className =
        type || "";

}


/* =========================================
   PHONE FORMAT
========================================= */

function formatEgyptPhone(phone){

    phone =
        phone
        .trim()
        .replace(/\s+/g,"")
        .replace(/-/g,"");


    /*
       01012345678
    */

    if(
        /^01[0125]\d{8}$/.test(phone)
    ){

        return "+20" +
            phone.substring(1);

    }


    /*
       +201012345678
    */

    if(
        /^\+201[0125]\d{8}$/.test(phone)
    ){

        return phone;

    }


    /*
       201012345678
    */

    if(
        /^201[0125]\d{8}$/.test(phone)
    ){

        return "+" +
            phone;

    }


    /*
       00201012345678
    */

    if(
        /^00201[0125]\d{8}$/.test(phone)
    ){

        return "+" +
            phone.substring(2);

    }


    return "";

}


/* =========================================
   PHONE INTERNAL ID
========================================= */

function phoneToEmail(phone){

    return (
        phone
        .replace("+","")
        .replace(/\D/g,"")
        +
        "@sandoqak.local"
    );

}


/* =========================================
   CUSTOMER
========================================= */

async function saveCustomer(
    user,
    data
){

    const customerRef =
        doc(
            db,
            "customers",
            user.uid
        );


    const customerSnap =
        await getDoc(
            customerRef
        );


    /*
       العميل جديد
    */

    if(
        !customerSnap.exists()
    ){

        await setDoc(

            customerRef,

            {

                uid:
                    user.uid,

                name:
                    data.name ||
                    user.displayName ||
                    "",

                phone:
                    data.phone ||
                    "",

                email:
                    user.email ||
                    data.email ||
                    "",

                points:
                    0,

                totalPurchases:
                    0,

                createdAt:
                    serverTimestamp()

            }

        );

        return;

    }


    /*
       العميل موجود:
       لا نلمس النقاط والمشتريات.
       نحدّث فقط البيانات الأساسية
       إذا كانت متاحة.
    */

    const oldData =
        customerSnap.data();


    const updateData = {};


    if(
        data.name &&
        data.name !== oldData.name
    ){

        updateData.name =
            data.name;

    }


    if(
        data.phone &&
        data.phone !== oldData.phone
    ){

        updateData.phone =
            data.phone;

    }


    if(
        user.email &&
        user.email !== oldData.email
    ){

        updateData.email =
            user.email;

    }


    if(
        Object.keys(updateData).length > 0
    ){

        await setDoc(

            customerRef,

            updateData,

            {
                merge:true
            }

        );

    }

}


/* =========================================
   REGISTER
========================================= */

registerBtn.addEventListener(
    "click",
    async function(){

        const name =
            registerName.value.trim();

        const phone =
            formatEgyptPhone(
                registerPhone.value
            );

        const email =
            registerEmail.value.trim();

        const password =
            registerPassword.value;

        const password2 =
            registerPassword2.value;


        /* =========================
           NAME
        ========================== */

        if(
            name.length < 2
        ){

            showMessage(
                "❌ اكتب الاسم بشكل صحيح.",
                "error"
            );

            return;

        }


        /* =========================
           PHONE
        ========================== */

        if(!phone){

            showMessage(
                "❌ رقم الهاتف المصري غير صحيح.",
                "error"
            );

            return;

        }


        /* =========================
           EMAIL
        ========================== */

        if(
            !email ||
            !email.includes("@")
        ){

            showMessage(
                "❌ اكتب بريدًا إلكترونيًا صحيحًا.",
                "error"
            );

            return;

        }


        /* =========================
           PASSWORD
        ========================== */

        if(
            password.length < 6
        ){

            showMessage(
                "❌ كلمة المرور يجب أن تكون 6 أحرف أو أكثر.",
                "error"
            );

            return;

        }


        if(
            password !== password2
        ){

            showMessage(
                "❌ كلمتا المرور غير متطابقتين.",
                "error"
            );

            return;

        }


        registerBtn.disabled =
            true;

        registerBtn.textContent =
            "جاري إنشاء الحساب...";


        try{

            /*
               Firebase Auth يستخدم البريد
               للمصادقة.
            */

            const result =
                await createUserWithEmailAndPassword(

                    auth,

                    email,

                    password

                );


            /*
               حفظ بيانات العميل.
            */

            await saveCustomer(

                result.user,

                {

                    name:
                        name,

                    phone:
                        phone,

                    email:
                        email

                }

            );


            showMessage(
                "🎉 تم إنشاء الحساب بنجاح!",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                900
            );


        }

        catch(error){

            console.error(
                "Register Error:",
                error
            );


            let text =
                "❌ حدث خطأ أثناء إنشاء الحساب.";


            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                text =
                    "❌ البريد الإلكتروني مستخدم بالفعل.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "❌ البريد الإلكتروني غير صحيح.";

            }

            else if(
                error.code ===
                "auth/weak-password"
            ){

                text =
                    "❌ كلمة المرور ضعيفة.";

            }

            else if(
                error.code ===
                "auth/operation-not-allowed"
            ){

                text =
                    "❌ فعّل Email/Password في Firebase Authentication.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                    "❌ مشكلة في الإنترنت.";

            }


            showMessage(
                text,
                "error"
            );


            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "إنشاء الحساب 🎁";

        }

    }
);


/* =========================================
   LOGIN BY PHONE + PASSWORD
========================================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const phone =
            formatEgyptPhone(
                loginPhone.value
            );

        const password =
            loginPassword.value;


        if(!phone){

            showMessage(
                "❌ اكتب رقم هاتف مصري صحيح.",
                "error"
            );

            return;

        }


        if(!password){

            showMessage(
                "❌ اكتب كلمة المرور.",
                "error"
            );

            return;

        }


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "جاري تسجيل الدخول...";


        try{

            /*
               الرقم يتحول إلى معرف داخلي.

               ملاحظة:
               الحسابات التي أنشئت من هذه النسخة
               باستخدام البريد لن يكون الدخول إليها
               بالرقم ممكنًا إلا إذا كان الحساب
               قد أنشئ بالنظام الداخلي للرقم.
            */

            const internalEmail =
                phoneToEmail(phone);


            const result =
                await signInWithEmailAndPassword(

                    auth,

                    internalEmail,

                    password

                );


            await saveCustomer(

                result.user,

                {

                    phone:
                        phone

                }

            );


            showMessage(
                "✅ تم تسجيل الدخول بنجاح.",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                700
            );


        }

        catch(error){

            console.error(
                "Phone Login Error:",
                error
            );


            showMessage(
                "❌ رقم الهاتف أو كلمة المرور غير صحيحة.",
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "تسجيل الدخول 🔐";

        }

    }
);


/* =========================================
   GOOGLE
========================================= */

googleBtn.addEventListener(
    "click",
    async function(){

        googleBtn.disabled =
            true;

        googleBtn.textContent =
            "...";


        try{

            const provider =
                new GoogleAuthProvider();


            const result =
                await signInWithPopup(

                    auth,

                    provider

                );


            /*
               Google لا يضمن رقم الهاتف.
               لذلك نتحقق هل العميل موجود
               ولديه رقم هاتف بالفعل.
            */

            const customerRef =
                doc(
                    db,
                    "customers",
                    result.user.uid
                );


            const customerSnap =
                await getDoc(
                    customerRef
                );


            if(
                !customerSnap.exists()
            ){

                /*
                   إنشاء العميل بدون رقم
                   غير مسموح لأن الرقم أساسي.
                */

                showMessage(
                    "⚠️ تم تسجيل Google. أضف رقم الهاتف لاستكمال ملف العميل.",
                    "info"
                );


                /*
                   نترك الحساب مسجلًا
                   ونوجهه لصفحة إكمال البيانات.
                */

                setTimeout(
                    function(){

                        window.location.href =
                            "complete-profile.html";

                    },
                    1000
                );

                return;

            }


            const customerData =
                customerSnap.data();


            if(
                !customerData.phone
            ){

                showMessage(
                    "⚠️ يجب إضافة رقم الهاتف إلى ملف العميل.",
                    "info"
                );


                setTimeout(
                    function(){

                        window.location.href =
                            "complete-profile.html";

                    },
                    1000
                );

                return;

            }


            showMessage(
                "✅ تم تسجيل الدخول باستخدام Google.",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                700
            );

        }

        catch(error){

            console.error(
                "Google Error:",
                error
            );


            showMessage(
                "❌ لم يتم تسجيل الدخول باستخدام Google.",
                "error"
            );


            googleBtn.disabled =
                false;

            googleBtn.textContent =
                "G";

        }

    }
);


/* =========================================
   INITIAL STATE
========================================= */

showMessage(
    "",
    ""
);

</script>

</body>
</html>
