<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SANDOQAK | تسجيل الدخول</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#090909;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#ccc;
}

input{
    width:100%;
    height:48px;
    background:#181818;
    border:1px solid #333;
    border-radius:10px;
    color:#fff;
    padding:12px;
    font-size:16px;
    outline:none;
    margin-bottom:14px;
}

input:focus{
    border-color:#00e5ff;
}

button{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.phone-btn{
    background:#00e5ff;
    color:#000;
}

.verify-btn{
    background:#22c55e;
    color:#fff;
    margin-top:8px;
}

.email-btn{
    background:#333;
    color:#fff;
}

.google-btn{
    background:#fff;
    color:#111;
}

#codeBox,
#emailBox{
    display:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0;
    color:#777;
}

.divider::before,
.divider::after{
    content:"";
    height:1px;
    background:#333;
    flex:1;
}

.option{
    margin-top:10px;
}

#message{
    margin-top:15px;
    text-align:center;
    line-height:1.6;
    min-height:25px;
}

.error{
    color:#ff7777;
}

.success{
    color:#6dff91;
}

.info{
    color:#ccc;
}

#recaptcha-container{
    margin:15px 0;
    display:flex;
    justify-content:center;
}

.small{
    color:#777;
    font-size:13px;
    text-align:center;
    margin-top:12px;
}

</style>
</head>

<body>

<div class="box">

    <h1>📦 SANDOQAK</h1>

    <p class="subtitle">
        تسجيل الدخول أو إنشاء حساب
    </p>


    <!-- =========================
         PHONE
    ========================== -->

    <label for="phone">
        رقم الهاتف
    </label>

    <input
        id="phone"
        type="tel"
        placeholder="مثال: 01012345678"
        autocomplete="tel"
    >

    <div id="recaptcha-container"></div>

    <button
        id="sendBtn"
        class="phone-btn"
        type="button"
    >
        إرسال كود للهاتف 📱
    </button>


    <div id="codeBox">

        <label
            for="code"
            style="margin-top:20px;"
        >
            كود التحقق
        </label>

        <input
            id="code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="أدخل الكود"
            autocomplete="one-time-code"
        >

        <button
            id="verifyBtn"
            class="verify-btn"
            type="button"
        >
            تأكيد الكود ✅
        </button>

    </div>


    <div class="divider">
        أو
    </div>


    <!-- =========================
         OTHER OPTIONS
    ========================== -->

    <button
        id="emailToggle"
        class="email-btn"
        type="button"
    >
        📧 الدخول بالبريد الإلكتروني
    </button>


    <div id="emailBox">

        <label
            for="email"
            style="margin-top:18px;"
        >
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
        >


        <label for="password">
            كلمة المرور
        </label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >


        <button
            id="emailLoginBtn"
            class="verify-btn"
            type="button"
        >
            تسجيل الدخول 📧
        </button>

    </div>


    <div class="option">

        <button
            id="googleBtn"
            class="google-btn"
            type="button"
        >
            المتابعة باستخدام Google
        </button>

    </div>


    <p class="small">
        رقم الهاتف هو الحساب الأساسي للنقاط والمشتريات.
    </p>


    <div id="message"></div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3NvbBmiX-2nBBFw-X6KBkpU_8ZOQnDvQ",

    authDomain:
    "sandoqak-479c4.firebaseapp.com",

    projectId:
    "sandoqak-479c4",

    storageBucket:
    "sandoqak-479c4.firebasestorage.app",

    messagingSenderId:
    "295608980009",

    appId:
    "1:295608980009:web:f3176896d1b5f461c30238"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const phoneInput =
    document.getElementById("phone");

const codeInput =
    document.getElementById("code");

const sendBtn =
    document.getElementById("sendBtn");

const verifyBtn =
    document.getElementById("verifyBtn");

const codeBox =
    document.getElementById("codeBox");

const emailToggle =
    document.getElementById("emailToggle");

const emailBox =
    document.getElementById("emailBox");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const emailLoginBtn =
    document.getElementById("emailLoginBtn");

const googleBtn =
    document.getElementById("googleBtn");

const message =
    document.getElementById("message");


let confirmationResult = null;
let recaptchaVerifier = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.className =
        type || "";

    message.innerText =
        text;

}


/* =========================
   PHONE FORMAT
========================= */

function formatEgyptPhone(phone){

    phone =
        phone
        .replace(/\s+/g,"")
        .replace(/-/g,"");


    if(phone.startsWith("01")){

        return "+20" +
            phone.substring(1);

    }


    if(phone.startsWith("0020")){

        return "+" +
            phone.substring(2);

    }


    return phone;

}


/* =========================
   RECAPTCHA
========================= */

function createRecaptcha(){

    if(recaptchaVerifier){

        try{
            recaptchaVerifier.clear();
        }catch(e){}

    }


    recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size:"normal"
            }
        );

}


createRecaptcha();


/* =========================
   CUSTOMER DATA
========================= */

async function createCustomerIfNeeded(user){

    const customerRef =
        doc(
            db,
            "customers",
            user.uid
        );


    const customerSnap =
        await getDoc(
            customerRef
        );


    /*
       إنشاء العميل لأول مرة فقط.
       لن نضع points:0 مرة أخرى
       على حساب موجود.
    */

    if(!customerSnap.exists()){

        await setDoc(

            customerRef,

            {
                uid:user.uid,

                phone:user.phoneNumber || "",

                email:user.email || "",

                name:user.displayName || "",

                points:0,

                totalPurchases:0,

                createdAt:
                    serverTimestamp()

            }

        );

    }

}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){
            return;
        }


        try{

            await createCustomerIfNeeded(
                user
            );


            showMessage(
                "✅ تم تسجيل الدخول، جاري فتح المتجر...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                800
            );


        }catch(error){

            console.error(error);

            showMessage(
                "❌ تم الدخول ولكن حدث خطأ في تحميل الحساب.",
                "error"
            );

        }

    }
);


/* =========================
   SEND PHONE CODE
========================= */

sendBtn.addEventListener(
    "click",
    async function(){

        const phone =
            formatEgyptPhone(
                phoneInput.value.trim()
            );


        if(
            !/^\+20\d{10}$/.test(phone)
        ){

            showMessage(
                "❌ اكتب رقم مصري صحيح مثل 01012345678.",
                "error"
            );

            return;

        }


        sendBtn.disabled =
            true;

        sendBtn.innerText =
            "جاري إرسال الكود...";


        try{

            if(!recaptchaVerifier){

                createRecaptcha();

            }


            confirmationResult =
                await signInWithPhoneNumber(
                    auth,
                    phone,
                    recaptchaVerifier
                );


            codeBox.style.display =
                "block";


            showMessage(
                "✅ تم إرسال الكود إلى هاتفك.",
                "success"
            );


            sendBtn.innerText =
                "تم إرسال الكود";


        }catch(error){

            console.error(error);


            showMessage(
                "❌ لم يتم إرسال الكود. حاول مرة أخرى.",
                "error"
            );


            sendBtn.disabled =
                false;

            sendBtn.innerText =
                "إرسال كود للهاتف 📱";


            createRecaptcha();

        }

    }
);


/* =========================
   VERIFY PHONE CODE
========================= */

verifyBtn.addEventListener(
    "click",
    async function(){

        if(!confirmationResult){

            showMessage(
                "❌ اطلب الكود أولًا.",
                "error"
            );

            return;

        }


        const code =
            codeInput.value.trim();


        if(!/^\d{6}$/.test(code)){

            showMessage(
                "❌ أدخل كود التحقق المكون من 6 أرقام.",
                "error"
            );

            return;

        }


        verifyBtn.disabled =
            true;

        verifyBtn.innerText =
            "جاري التحقق...";


        try{

            const result =
                await confirmationResult.confirm(
                    code
                );


            await createCustomerIfNeeded(
                result.user
            );


            showMessage(
                "🎉 تم تسجيل الحساب بنجاح!",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                1000
            );


        }catch(error){

            console.error(error);


            showMessage(
                "❌ كود التحقق غير صحيح أو انتهت صلاحيته.",
                "error"
            );


            verifyBtn.disabled =
                false;

            verifyBtn.innerText =
                "تأكيد الكود ✅";

        }

    }
);


/* =========================
   EMAIL BOX
========================= */

emailToggle.addEventListener(
    "click",
    function(){

        if(
            emailBox.style.display ===
            "block"
        ){

            emailBox.style.display =
                "none";

        }else{

            emailBox.style.display =
                "block";

        }

    }
);


/* =========================
   EMAIL LOGIN
========================= */

emailLoginBtn.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "❌ اكتب البريد الإلكتروني وكلمة المرور.",
                "error"
            );

            return;

        }


        emailLoginBtn.disabled =
            true;

        emailLoginBtn.innerText =
            "جاري تسجيل الدخول...";


        try{

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            await createCustomerIfNeeded(
                result.user
            );


            showMessage(
                "✅ تم تسجيل الدخول.",
                "success"
            );


        }catch(error){

            console.error(error);


            let text =
                "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                text =
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }


            showMessage(
                text,
                "error"
            );


            emailLoginBtn.disabled =
                false;

            emailLoginBtn.innerText =
                "تسجيل الدخول 📧";

        }

    }
);


/* =========================
   GOOGLE LOGIN
========================= */

googleBtn.addEventListener(
    "click",
    async function(){

        googleBtn.disabled =
            true;

        googleBtn.innerText =
            "جاري فتح Google...";


        try{

            const provider =
                new GoogleAuthProvider();


            const result =
                await signInWithPopup(
                    auth,
                    provider
                );


            await createCustomerIfNeeded(
                result.user
            );


            showMessage(
                "✅ تم تسجيل الدخول باستخدام Google.",
                "success"
            );


        }catch(error){

            console.error(error);


            showMessage(
                "❌ لم يتم تسجيل الدخول باستخدام Google.",
                "error"
            );


            googleBtn.disabled =
                false;

            googleBtn.innerText =
                "المتابعة باستخدام Google";

        }

    }
);

</script>

</body>

</html>
