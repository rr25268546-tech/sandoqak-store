<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SANDOQAK | تسجيل الدخول</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#090909;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.45);
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#ccc;
}

input{
    width:100%;
    height:48px;
    background:#181818;
    border:1px solid #333;
    border-radius:10px;
    color:#fff;
    padding:12px;
    font-size:16px;
    outline:none;
    margin-bottom:14px;
}

input:focus{
    border-color:#00e5ff;
}

button{
    border:0;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.phone-btn{
    width:100%;
    height:48px;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
}

.verify-btn{
    width:100%;
    height:48px;
    border-radius:10px;
    background:#22c55e;
    color:#fff;
    margin-top:8px;
}

#codeBox,
#emailBox{
    display:none;
}

#recaptcha-container{
    margin:15px 0;
    display:flex;
    justify-content:center;
}

.other-title{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:20px;
    margin-bottom:13px;
}

.social-options{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
}

.social-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    transition:.2s;
    border:1px solid #333;
}

.social-btn:hover{
    transform:translateY(-3px);
    border-color:#777;
}

.email-circle{
    background:#222;
    color:#fff;
}

.google-circle{
    background:#fff;
    color:#4285F4;
}

.facebook-circle{
    background:#1877F2;
    color:#fff;
}

#emailBox{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #292929;
}

#message{
    margin-top:15px;
    text-align:center;
    line-height:1.6;
    min-height:25px;
    word-break:break-word;
}

.error{
    color:#ff7777;
}

.success{
    color:#6dff91;
}

.info{
    color:#ccc;
}

.small{
    color:#777;
    font-size:12px;
    text-align:center;
    margin-top:15px;
    line-height:1.6;
}

.firebase-error{
    margin-top:8px;
    font-size:11px;
    color:#ff9999;
    direction:ltr;
}

</style>
</head>

<body>

<div class="box">

    <h1>📦 SANDOQAK</h1>

    <p class="subtitle">
        تسجيل الدخول أو إنشاء حساب
    </p>


    <!-- =========================
         PHONE
    ========================== -->

    <label for="phone">
        رقم الهاتف المصري
    </label>

    <input
        id="phone"
        type="tel"
        placeholder="01012345678"
        autocomplete="tel"
        inputmode="tel"
    >


    <div id="recaptcha-container"></div>


    <button
        id="sendBtn"
        class="phone-btn"
        type="button"
    >
        إرسال كود للهاتف 📱
    </button>


    <!-- =========================
         CODE
    ========================== -->

    <div id="codeBox">

        <label
            for="code"
            style="margin-top:20px;"
        >
            كود التحقق
        </label>

        <input
            id="code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="أدخل الكود المكون من 6 أرقام"
            autocomplete="one-time-code"
        >

        <button
            id="verifyBtn"
            class="verify-btn"
            type="button"
        >
            تأكيد الكود ✅
        </button>

    </div>


    <!-- =========================
         OTHER OPTIONS
    ========================== -->

    <div class="other-title">
        أو الدخول باستخدام
    </div>


    <div class="social-options">

        <button
            id="emailToggle"
            class="social-btn email-circle"
            type="button"
            title="البريد الإلكتروني"
        >
            ✉️
        </button>


        <button
            id="googleBtn"
            class="social-btn google-circle"
            type="button"
            title="Google"
        >
            G
        </button>


        <button
            id="facebookBtn"
            class="social-btn facebook-circle"
            type="button"
            title="Facebook"
        >
            f
        </button>

    </div>


    <!-- =========================
         EMAIL
    ========================== -->

    <div id="emailBox">

        <label for="email">
            البريد الإلكتروني
        </label>

        <input
            id="email"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
        >


        <label for="password">
            كلمة المرور
        </label>

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >


        <button
            id="emailLoginBtn"
            class="verify-btn"
            type="button"
        >
            تسجيل الدخول 📧
        </button>

    </div>


    <p class="small">

        📱 رقم الهاتف هو الحساب الأساسي للنقاط والمشتريات.

        <br>

        🎁 النقاط لا يتم تصفيرها عند تسجيل الدخول مرة أخرى.

    </p>


    <div id="message"></div>

</div>


<script type="module">

/* =========================
   FIREBASE APP
========================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* =========================
   FIREBASE AUTH
========================= */

import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   FIRESTORE
========================= */

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3NvbBmiX-2nBBFw-X6KBkpU_8ZOQnDvQ",

    authDomain:
    "sandoqak-479c4.firebaseapp.com",

    projectId:
    "sandoqak-479c4",

    storageBucket:
    "sandoqak-479c4.firebasestorage.app",

    messagingSenderId:
    "295608980009",

    appId:
    "1:295608980009:web:f3176896d1b5f461c30238"

};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const phoneInput =
    document.getElementById("phone");

const codeInput =
    document.getElementById("code");

const sendBtn =
    document.getElementById("sendBtn");

const verifyBtn =
    document.getElementById("verifyBtn");

const codeBox =
    document.getElementById("codeBox");

const emailToggle =
    document.getElementById("emailToggle");

const emailBox =
    document.getElementById("emailBox");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const emailLoginBtn =
    document.getElementById("emailLoginBtn");

const googleBtn =
    document.getElementById("googleBtn");

const facebookBtn =
    document.getElementById("facebookBtn");

const message =
    document.getElementById("message");


let confirmationResult =
    null;

let recaptchaVerifier =
    null;


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    message.className =
        type || "";

    message.innerText =
        text;

}


/* =========================
   FIREBASE ERROR
========================= */

function showFirebaseError(
    error
){

    console.error(
        "Firebase Error:",
        error
    );


    let text =
        "❌ حدث خطأ أثناء إرسال الكود.";


    switch(error.code){

        case "auth/invalid-phone-number":

            text =
                "❌ رقم الهاتف غير صحيح.";

            break;


        case "auth/too-many-requests":

            text =
                "❌ تم تجاوز عدد المحاولات. انتظر قليلًا ثم حاول مرة أخرى.";

            break;


        case "auth/quota-exceeded":

            text =
                "❌ تم تجاوز حد إرسال الرسائل المتاح.";

            break;


        case "auth/captcha-check-failed":

            text =
                "❌ فشل التحقق من reCAPTCHA.";

            break;


        case "auth/operation-not-allowed":

            text =
                "❌ تسجيل الدخول بالهاتف غير مفعّل في Firebase.";

            break;


        case "auth/app-not-authorized":

            text =
                "❌ هذا الموقع غير مصرح له باستخدام Firebase Authentication.";

            break;


        case "auth/billing-not-enabled":

            text =
                "❌ Firebase يطلب إعدادات الفوترة لهذه العملية.";

            break;


        case "auth/network-request-failed":

            text =
                "❌ مشكلة في الإنترنت. حاول مرة أخرى.";

            break;


        case "auth/internal-error":

            text =
                "❌ حدث خطأ داخلي في Firebase.";

            break;


        default:

            text =
                "❌ لم يتم إرسال الكود.";

    }


    showMessage(
        text,
        "error"
    );


    const errorCode =
        document.createElement("div");


    errorCode.className =
        "firebase-error";


    errorCode.innerText =
        error.code ||
        "unknown-error";


    message.appendChild(
        errorCode
    );

}



/* =========================
   EGYPT PHONE
========================= */

function formatEgyptPhone(
    phone
){

    phone =
        phone
        .replace(/\s+/g,"")
        .replace(/-/g,"");


    /*
       01012345678
       ↓
       +201012345678
    */

    if(
        /^01\d{9}$/.test(phone)
    ){

        return "+20" +
            phone.substring(1);

    }


    /*
       201012345678
    */

    if(
        /^20\d{10}$/.test(phone)
    ){

        return "+" +
            phone;

    }


    /*
       00201012345678
    */

    if(
        /^0020\d{10}$/.test(phone)
    ){

        return "+" +
            phone.substring(2);

    }


    /*
       +201012345678
    */

    if(
        /^\+20\d{10}$/.test(phone)
    ){

        return phone;

    }


    return "";

}



/* =========================
   RECAPTCHA
========================= */

function createRecaptcha(){

    try{

        if(
            recaptchaVerifier
        ){

            recaptchaVerifier.clear();

        }

    }catch(e){}


    recaptchaVerifier =

        new RecaptchaVerifier(

            auth,

            "recaptcha-container",

            {

                size:"normal"

            }

        );

}


createRecaptcha();



/* =========================
   CUSTOMER
========================= */

async function createCustomerIfNeeded(
    user
){

    const customerRef =

        doc(

            db,

            "customers",

            user.uid

        );


    const customerSnap =

        await getDoc(
            customerRef
        );


    /*
       إنشاء العميل أول مرة فقط
    */

    if(
        !customerSnap.exists()
    ){

        await setDoc(

            customerRef,

            {

                uid:
                    user.uid,

                phone:
                    user.phoneNumber || "",

                email:
                    user.email || "",

                name:
                    user.displayName || "",

                points:
                    0,

                totalPurchases:
                    0,

                createdAt:
                    serverTimestamp()

            }

        );

    }

}



/* =========================
   SEND SMS
========================= */

sendBtn.addEventListener(

    "click",

    async function(){

        const phone =

            formatEgyptPhone(

                phoneInput.value.trim()

            );


        if(!phone){

            showMessage(

                "❌ اكتب رقم مصري صحيح مثل 01012345678.",

                "error"

            );

            return;

        }


        showMessage(
            "",
            ""
        );


        sendBtn.disabled =
            true;


        sendBtn.innerText =
            "جاري إرسال الكود...";


        try{


            if(
                !recaptchaVerifier
            ){

                createRecaptcha();

            }


            confirmationResult =

                await signInWithPhoneNumber(

                    auth,

                    phone,

                    recaptchaVerifier

                );


            codeBox.style.display =
                "block";


            showMessage(

                "✅ تم إرسال كود التحقق إلى " +
                phone,

                "success"

            );


            sendBtn.innerText =
                "تم إرسال الكود";


        }

        catch(error){

            showFirebaseError(
                error
            );


            sendBtn.disabled =
                false;


            sendBtn.innerText =
                "إرسال كود للهاتف 📱";


            createRecaptcha();

        }

    }

);



/* =========================
   VERIFY SMS
========================= */

verifyBtn.addEventListener(

    "click",

    async function(){

        if(
            !confirmationResult
        ){

            showMessage(

                "❌ اطلب الكود أولًا.",

                "error"

            );

            return;

        }


        const code =
            codeInput.value.trim();


        if(
            !/^\d{6}$/.test(code)
        ){

            showMessage(

                "❌ أدخل الكود المكون من 6 أرقام.",

                "error"

            );

            return;

        }


        verifyBtn.disabled =
            true;


        verifyBtn.innerText =
            "جاري التحقق...";


        try{


            const result =

                await confirmationResult.confirm(
                    code
                );


            await createCustomerIfNeeded(
                result.user
            );


            showMessage(

                "🎉 تم تسجيل الحساب بنجاح!",

                "success"

            );


            setTimeout(

                function(){

                    window.location.href =
                        "index.html";

                },

                1000

            );

        }

        catch(error){

            console.error(
                error
            );


            showMessage(

                "❌ كود التحقق غير صحيح أو انتهت صلاحيته.",

                "error"

            );


            verifyBtn.disabled =
                false;


            verifyBtn.innerText =
                "تأكيد الكود ✅";

        }

    }

);



/* =========================
   EMAIL OPEN
========================= */

emailToggle.addEventListener(

    "click",

    function(){

        if(
            emailBox.style.display ===
            "block"
        ){

            emailBox.style.display =
                "none";

        }

        else{

            emailBox.style.display =
                "block";

            emailInput.focus();

        }

    }

);



/* =========================
   EMAIL LOGIN
========================= */

emailLoginBtn.addEventListener(

    "click",

    async function(){

        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !email ||
            !password
        ){

            showMessage(

                "❌ اكتب البريد الإلكتروني وكلمة المرور.",

                "error"

            );

            return;

        }


        emailLoginBtn.disabled =
            true;


        emailLoginBtn.innerText =
            "جاري تسجيل الدخول...";


        try{


            const result =

                await signInWithEmailAndPassword(

                    auth,

                    email,

                    password

                );


            await createCustomerIfNeeded(
                result.user
            );


            showMessage(

                "✅ تم تسجيل الدخول بنجاح.",

                "success"

            );


            setTimeout(

                function(){

                    window.location.href =
                        "index.html";

                },

                800

            );

        }

        catch(error){

            console.error(
                error
            );


            showMessage(

                "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.",

                "error"

            );


            emailLoginBtn.disabled =
                false;


            emailLoginBtn.innerText =
                "تسجيل الدخول 📧";

        }

    }

);



/* =========================
   GOOGLE
========================= */

googleBtn.addEventListener(

    "click",

    async function(){

        googleBtn.disabled =
            true;


        googleBtn.innerText =
            "...";


        try{


            const provider =
                new GoogleAuthProvider();


            const result =

                await signInWithPopup(

                    auth,

                    provider

                );


            await createCustomerIfNeeded(
                result.user
            );


            showMessage(

                "✅ تم تسجيل الدخول باستخدام Google.",

                "success"

            );


            setTimeout(

                function(){

                    window.location.href =
                        "index.html";

                },

                800

            );

        }

        catch(error){

            console.error(
                error
            );


            showMessage(

                "❌ لم يتم تسجيل الدخول باستخدام Google.",

                "error"

            );


            googleBtn.disabled =
                false;


            googleBtn.innerText =
                "G";

        }

    }

);



/* =========================
   FACEBOOK
========================= */

facebookBtn.addEventListener(

    "click",

    function(){

        showMessage(

            "🔵 تسجيل الدخول بفيسبوك سيتم تفعيله بعد إكمال إعداد Meta.",

            "info"

        );

    }

);

</script>

</body>

</html>
