<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | SANDOQAK</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#090909;
    color:#fff;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}


/* LOGIN */

.login-box{
    max-width:420px;
    margin:70px auto;
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
    padding:25px;
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#999;
    line-height:1.7;
    margin-bottom:25px;
}

.input-group{
    position:relative;
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    height:48px;
    padding:12px;
    border-radius:10px;
    border:1px solid #333;
    background:#181818;
    color:#fff;
    outline:none;
    font-size:15px;
}

.input-group input:focus{
    border-color:#00e5ff;
}

.password-input{
    padding-left:90px !important;
}

.show-password{
    position:absolute;
    left:6px;
    top:6px;
    height:36px;
    padding:0 10px;
    border:0;
    border-radius:8px;
    background:#333;
    color:#fff;
    cursor:pointer;
}

.login-btn{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    line-height:1.6;
    display:none;
}

.message.error{
    display:block;
    background:#351212;
    color:#ff8f8f;
    border:1px solid #702020;
}

.message.success{
    display:block;
    background:#12351b;
    color:#8fffaa;
    border:1px solid #20702e;
}


/* ADMIN */

#adminPanel{
    display:none;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#00e5ff;
}

.buttons{
    display:flex;
    gap:8px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

.refresh{
    background:#00e5ff;
    color:#000;
}

.logout{
    background:#e53935;
    color:#fff;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:30px;
    margin-bottom:8px;
}

.title p{
    color:#999;
}


/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:20px;
}

.stat-title{
    color:#999;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}


/* ORDERS */

.orders-box{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:20px;
}

.orders-box h2{
    margin-bottom:20px;
}

.order{
    background:#181818;
    border:1px solid #303030;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.order-id{
    color:#00e5ff;
    font-weight:bold;
}

.date{
    color:#888;
    font-size:13px;
}

.customer{
    color:#ddd;
    line-height:2;
}

.products{
    margin-top:15px;
    padding:12px 0;
    border-top:1px solid #303030;
    border-bottom:1px solid #303030;
}

.product{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
}

.total{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

.delete{
    margin-top:15px;
    border:0;
    border-radius:9px;
    padding:9px 14px;
    background:#e53935;
    color:#fff;
    cursor:pointer;
}

.loading,
.empty{
    text-align:center;
    color:#999;
    padding:35px 10px;
}

.error-box{
    background:#351212;
    color:#ffbaba;
    border:1px solid #702020;
    border-radius:10px;
    padding:15px;
    line-height:1.7;
}


/* MOBILE */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:stretch;
        gap:15px;
    }

    .buttons{
        width:100%;
    }

    .btn{
        flex:1;
    }

    .order-header{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     LOGIN
========================= -->

<div
    class="login-box"
    id="loginBox"
>

    <h1>
        👑 SANDOQAK
    </h1>

    <p>
        لوحة الإدارة
        <br>
        سجل دخولك للمتابعة
    </p>


    <div class="input-group">

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            autocomplete="username"
        >

    </div>


    <div class="input-group">

        <input
            type="password"
            id="password"
            class="password-input"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="show-password"
            id="showPassword"
        >
            👁️ إظهار
        </button>

    </div>


    <button
        type="button"
        class="login-btn"
        id="loginBtn"
    >
        تسجيل الدخول 🔐
    </button>


    <div
        id="loginMessage"
        class="message"
    ></div>

</div>



<!-- =========================
     ADMIN PANEL
========================= -->

<div
    id="adminPanel"
>


    <div class="header">

        <div class="logo">
            SANDOQ<span>AK</span> 👑
        </div>


        <div class="buttons">

            <button
                type="button"
                class="btn refresh"
                id="refreshBtn"
            >
                🔄 تحديث
            </button>


            <button
                type="button"
                class="btn logout"
                id="logoutBtn"
            >
                خروج
            </button>

        </div>

    </div>



    <div class="title">

        <h1>
            📦 الطلبات
        </h1>

        <p>
            لوحة إدارة طلبات العملاء
        </p>

    </div>



    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                📦 عدد الطلبات
            </div>

            <div
                class="stat-value"
                id="ordersCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                💰 إجمالي المبيعات
            </div>

            <div
                class="stat-value"
                id="salesTotal"
            >
                0 جنيه
            </div>

        </div>

    </div>



    <div class="orders-box">

        <h2>
            📋 كل الطلبات
        </h2>


        <div id="ordersList">

            <div class="loading">
                جاري تحميل الطلبات... ⏳
            </div>

        </div>

    </div>


</div>


</div>



<script type="module">


/* =========================
   Firebase
========================= */

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3NvbBmiX-2nBBFw-X6KBkpU_8ZOQnDvQ",

    authDomain:
    "sandoqak-479c4.firebaseapp.com",

    projectId:
    "sandoqak-479c4",

    storageBucket:
    "sandoqak-479c4.firebasestorage.app",

    messagingSenderId:
    "295608980009",

    appId:
    "1:295608980009:web:f3176896d1b5f461c30238"

};


/* =========================
   Authentication
========================= */

const authApp =
    initializeApp(
        firebaseConfig,
        "adminAuthApp"
    );

const auth =
    getAuth(authApp);


/* =========================
   Elements
========================= */

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loginMessage =
    document.getElementById("loginMessage");

const loginBox =
    document.getElementById("loginBox");

const adminPanel =
    document.getElementById("adminPanel");

const showPassword =
    document.getElementById("showPassword");

const logoutBtn =
    document.getElementById("logoutBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const ordersList =
    document.getElementById("ordersList");

const ordersCount =
    document.getElementById("ordersCount");

const salesTotal =
    document.getElementById("salesTotal");


/* =========================
   Show Password
========================= */

showPassword.addEventListener(
    "click",
    function(){

        if(password.type === "password"){

            password.type = "text";

            showPassword.innerText =
                "🙈 إخفاء";

        }else{

            password.type = "password";

            showPassword.innerText =
                "👁️ إظهار";

        }

    }
);


/* =========================
   Login Message
========================= */

function showLoginError(message){

    loginMessage.className =
        "message error";

    loginMessage.innerText =
        message;

}


function clearLoginMessage(){

    loginMessage.className =
        "message";

    loginMessage.innerText =
        "";

}


/* =========================
   Login
========================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const userEmail =
            email.value.trim();

        const userPassword =
            password.value;


        clearLoginMessage();


        if(userEmail === ""){

            showLoginError(
                "⚠️ اكتب البريد الإلكتروني."
            );

            return;

        }


        if(userPassword === ""){

            showLoginError(
                "⚠️ اكتب كلمة المرور."
            );

            return;

        }


        loginBtn.disabled = true;

        loginBtn.innerText =
            "جاري التحقق... ⏳";


        try{

            await signInWithEmailAndPassword(
                auth,
                userEmail,
                userPassword
            );


            loginMessage.className =
                "message success";

            loginMessage.innerText =
                "✅ تم تسجيل الدخول بنجاح";


        }catch(error){

            console.error(
                "Login Error:",
                error
            );


            /* كلمة المرور أو الإيميل غلط */

            if(
                error.code ===
                "auth/invalid-credential"
            ){

                showLoginError(
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة."
                );

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                showLoginError(
                    "❌ كلمة المرور غير صحيحة."
                );

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                showLoginError(
                    "❌ الحساب غير موجود."
                );

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                showLoginError(
                    "❌ البريد الإلكتروني غير صحيح."
                );

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                showLoginError(
                    "⚠️ محاولات كثيرة. حاول بعد قليل."
                );

            }

            else{

                showLoginError(
                    "⚠️ حصل خطأ أثناء تسجيل الدخول. حاول مرة أخرى."
                );

            }


            loginBtn.disabled = false;

            loginBtn.innerText =
                "تسجيل الدخول 🔐";

        }

    }
);


/* =========================
   Authentication State
========================= */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            loginBox.style.display =
                "none";

            adminPanel.style.display =
                "block";

            loginBtn.disabled =
                false;

            loginBtn.innerText =
                "تسجيل الدخول 🔐";

            loadOrders();

        }else{

            loginBox.style.display =
                "block";

            adminPanel.style.display =
                "none";

        }

    }
);


/* =========================
   Logout
========================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await signOut(auth);

    }
);


/* =========================
   Refresh
========================= */

refreshBtn.addEventListener(
    "click",
    function(){

        loadOrders();

    }
);


/* =========================
   Load Orders
========================= */

async function loadOrders(){

    ordersList.innerHTML = `

        <div class="loading">
            جاري تحميل الطلبات... ⏳
        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "orders"
                )
            );


        ordersCount.innerText =
            snapshot.size;


        let sales = 0;


        if(snapshot.empty){

            ordersList.innerHTML = `

                <div class="empty">
                    لا توجد طلبات حتى الآن 📦
                </div>

            `;

            salesTotal.innerText =
                "0 جنيه";

            return;

        }


        ordersList.innerHTML = "";


        snapshot.forEach(
            function(orderDoc){

                const order =
                    orderDoc.data();


                sales +=
                    Number(order.total) || 0;


                let productsHTML = "";


                if(
                    Array.isArray(
                        order.products
                    )
                ){

                    order.products.forEach(
                        function(product){

                            productsHTML += `

                                <div class="product">

                                    <span>
                                        ${product.name || "منتج"}
                                    </span>

                                    <strong>
                                        ${Number(product.price) || 0}
                                        جنيه
                                    </strong>

                                </div>

                            `;

                        }
                    );

                }


                let date = "";


                if(order.createdAt){

                    try{

                        date =
                            order.createdAt
                                .toDate()
                                .toLocaleString(
                                    "ar-EG"
                                );

                    }catch(e){

                        date = "";

                    }

                }


                const orderElement =
                    document.createElement(
                        "div"
                    );


                orderElement.className =
                    "order";


                orderElement.innerHTML = `

                    <div class="order-header">

                        <div class="order-id">

                            📦 طلب #${orderDoc.id}

                        </div>

                        <div class="date">

                            ${date}

                        </div>

                    </div>


                    <div class="customer">

                        👤 الاسم:
                        ${order.name || "غير موجود"}

                        <br>

                        📱 الهاتف:
                        ${order.phone || "غير موجود"}

                        <br>

                        📍 العنوان:
                        ${order.address || "غير موجود"}

                    </div>


                    <div class="products">

                        ${productsHTML}

                    </div>


                    <div class="total">

                        💰 الإجمالي:
                        ${Number(order.total) || 0}
                        جنيه

                    </div>


                    <button
                        type="button"
                        class="delete"
                    >

                        🗑️ حذف الطلب

                    </button>

                `;


                const deleteButton =
                    orderElement.querySelector(
                        ".delete"
                    );


                deleteButton.addEventListener(
                    "click",
                    async function(){

                        await deleteOrder(
                            orderDoc.id
                        );

                    }
                );


                ordersList.appendChild(
                    orderElement
                );

            }
        );


        salesTotal.innerText =
            sales + " جنيه";


    }catch(error){

        console.error(error);


        ordersList.innerHTML = `

            <div class="error-box">

                ❌ حصل خطأ في تحميل الطلبات.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* =========================
   Delete Order
========================= */

async function deleteOrder(id){

    const answer =
        confirm(
            "هل أنت متأكد من حذف هذا الطلب؟"
        );


    if(!answer){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "orders",
                id
            )
        );


        loadOrders();


    }catch(error){

        console.error(error);

        alert(
            "❌ حصل خطأ أثناء حذف الطلب."
        );

    }

}

</script>


</body>

</html>
