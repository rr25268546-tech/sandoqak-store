<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم | SANDOQAK</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #090909;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 18px 20px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #00e5ff;
        }

        .home {
            background: #00e5ff;
            color: #000;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 18px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #aaa;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #111;
            border: 1px solid #252525;
            border-radius: 16px;
            padding: 20px;
        }

        .stat-title {
            color: #aaa;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 27px;
            font-weight: bold;
        }

        .orders {
            background: #111;
            border: 1px solid #252525;
            border-radius: 18px;
            padding: 20px;
        }

        .orders-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .refresh {
            background: #00e5ff;
            color: #000;
            border: 0;
            padding: 9px 14px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 40px 10px;
        }

        .order {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .order:last-child {
            margin-bottom: 0;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .order-id {
            color: #00e5ff;
            font-weight: bold;
        }

        .customer {
            color: #ddd;
            line-height: 1.9;
            margin-bottom: 15px;
        }

        .products {
            border-top: 1px solid #292929;
            border-bottom: 1px solid #292929;
            padding: 12px 0;
            margin-bottom: 15px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            color: #ddd;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .delete {
            background: #e53935;
            color: white;
            border: 0;
            padding: 9px 14px;
            border-radius: 9px;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .orders-title {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }

            .order-header {
                flex-direction: column;
            }

            .product {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        SANDOQ<span>AK</span> 👑

        </div>

    <div class="orders">

                🔄 تحديث

            </button>

        </div>


        <div id="ordersList"></div>


    </div>


</div>
