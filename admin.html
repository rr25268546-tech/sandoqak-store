<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | SANDOQAK</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#090909;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.login-box{
    max-width:420px;
    margin:80px auto;
    background:#111;
    border:1px solid #252525;
    border-radius:20px;
    padding:25px;
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

.password-box{
    position:relative;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:#181818;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
}

input:focus{
    border-color:#00e5ff;
}

.password-box input{
    padding-left:85px;
}

.toggle-password{
    position:absolute;
    left:7px;
    top:7px;
    padding:7px 10px;
    border:0;
    border-radius:8px;
    background:#333;
    color:white;
    cursor:pointer;
    font-size:13px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:15px;
    text-align:center;
    color:#ff7777;
    line-height:1.6;
}

#adminPanel{
    display:none;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:10px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#00e5ff;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-btn{
    padding:10px 14px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.logout{
    background:#e53935;
    color:white;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    margin-bottom:8px;
}

.title p{
    color:#aaa;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:20px;
}

.stat small{
    color:#aaa;
}
