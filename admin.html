<!DOCTYPE html>

<head>

<title>SANDOQAK | لوحة الإدارة</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

}

body{

}

.container{

}


/* =========================
   LOGIN
========================= */

.login-box{
    max-width:420px;
    margin:60px auto;
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
    padding:25px;
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#999;
    line-height:1.7;
    margin-bottom:25px;
}

.input-group{
    position:relative;
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    height:48px;
    padding:12px;
    border-radius:10px;
    border:1px solid #333;
    background:#181818;
    color:#fff;
    outline:none;
    font-size:15px;
}

.input-group input:focus{
    border-color:#00e5ff;
}

.password-input{
    padding-left:90px !important;
}

.show-btn{
    position:absolute;
    left:6px;
    top:6px;
    height:36px;
    border:0;
    border-radius:8px;
    padding:0 10px;
    background:#333;
    color:#fff;
    cursor:pointer;
}

.login-btn{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
}

.login-message{
    text-align:center;
    color:#ff7777;
    margin-top:15px;
    line-height:1.6;
}


/* =========================
   ADMIN
========================= */

#adminPanel{
    display:none;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:25px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#00e5ff;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

.refresh{
    background:#00e5ff;
    color:#000;
}

.logout{
    background:#e53935;
    color:#fff;
}


/* =========================
   TITLE
========================= */

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:30px;
    margin-bottom:8px;
}

.title p{
    color:#999;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:20px;
}

.stat-title{
    color:#999;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}


/* =========================
   ORDERS
========================= */

.orders-box{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:18px;
}

.orders-title{
    margin-bottom:18px;
}

.order{
    background:#181818;
    border:1px solid #303030;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.order:last-child{
    margin-bottom:0;
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.order-id{
    color:#00e5ff;
    font-weight:bold;
}

.order-date{
    color:#888;
    font-size:13px;
}

.customer{
    color:#ddd;
    line-height:2;
}

.products{
    margin-top:15px;
    padding:12px 0;
    border-top:1px solid #303030;
    border-bottom:1px solid #303030;
}

.product{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
}

.order-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.total{
    font-size:19px;
    font-weight:bold;
}

.status-box{
    margin-top:15px;
}

.status-label{
    display:block;
    margin-bottom:7px;
    color:#bbb;
}

.status-select{
    width:100%;
    height:43px;
    border:1px solid #333;
    border-radius:9px;
    background:#222;
    color:#fff;
    padding:8px;
    outline:none;
}

.status-select:focus{
    border-color:#00e5ff;
}

.order-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:12px;
}

.delete-btn{
    border:0;
    border-radius:9px;
    padding:9px 14px;
    background:#e53935;
    color:#fff;
    cursor:pointer;
}

.empty,
.loading{
    text-align:center;
    padding:35px 10px;
    color:#999;
}

.error{
    background:#351212;
    border:1px solid #702020;
    color:#ffbaba;
    border-radius:10px;
    padding:15px;
    line-height:1.7;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:stretch;
    }

    .header-buttons{
        width:100%;
    }

    .header-btn{
        flex:1;
    }

    .order-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .order-bottom{
        flex-direction:column;
        align-items:stretch;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================

========================= -->

<div
    class="login-box"

>

    <h1>

    </h1>

        id="loginMessage"
    ></div>

</div>



<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">


    <div class="header">

        <div class="logo">
            SANDOQ<span>AK</span> 👑
        </div>


        <div class="header-buttons">

            <button
                type="button"
                class="header-btn refresh"
                id="refreshBtn"
            >
                🔄 تحديث
            </button>


            <button
                type="button"
                class="header-btn logout"
                id="logoutBtn"
            >

            </button>

        </div>

    </div>



    <div class="title">

        <h1>
            📦 لوحة الطلبات
        </h1>

        <p>

        </p>

    </div>



    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                📦 عدد الطلبات
            </div>

            <div
                class="stat-value"
                id="ordersCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                💰 إجمالي المبيعات
            </div>

            <div
                class="stat-value"
                id="salesTotal"
            >
                0 جنيه
            </div>

        </div>


    </div>



    <div class="orders-box">

        <h2 class="orders-title">

        </h2>


        <div id="ordersList">

            </div>

    </div>


</div>


</div>



<!-- =========================
     PASSWORD BUTTON
========================= -->

<script>

function togglePassword(){

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("showPassword");


    if(
        password.type === "password"
    ){

        password.type = "text";

        button.innerHTML =
            "🙈 إخفاء";

    }else{

        password.type = "password";

        button.innerHTML =
            "👁️ إظهار";

    }

}

</script>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">


import { db } from "./firebase.js";


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3NvbBmiX-2nBBFw-X6KBkpU_8ZOQnDvQ",

    authDomain:
    "sandoqak-479c4.firebaseapp.com",

    projectId:
    "sandoqak-479c4",

    storageBucket:
    "sandoqak-479c4.firebasestorage.app",

    messagingSenderId:
    "295608980009",

    appId:
    "1:295608980009:web:f3176896d1b5f461c30238"

};



/* =========================
   AUTH APP
========================= */

const authApp =
    initializeApp(
        firebaseConfig,
        "adminAuthentication"
    );


const auth =
    getAuth(authApp);



/* =========================
   ELEMENTS
========================= */

const loginBox =
    document.getElementById("loginBox");

const adminPanel =
    document.getElementById("adminPanel");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loginMessage =
    document.getElementById("loginMessage");

const logoutBtn =
    document.getElementById("logoutBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const ordersList =
    document.getElementById("ordersList");

const ordersCount =
    document.getElementById("ordersCount");

const salesTotal =
    document.getElementById("salesTotal");



/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(
            email === "" ||
            password === ""
        ){

            loginMessage.innerText =
                "من فضلك اكتب الإيميل وكلمة المرور.";

            return;

        }


        loginBtn.disabled = true;

        loginBtn.innerText =
            "جاري تسجيل الدخول... ⏳";


        loginMessage.innerText = "";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        }catch(error){

            console.error(error);

            loginMessage.innerText =
                "الإيميل أو كلمة المرور غير صحيحة.";

            loginBtn.disabled = false;

            loginBtn.innerText =
                "تسجيل الدخول 🔐";

        }

    }
);



/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            loginBox.style.display =
                "none";

            adminPanel.style.display =
                "block";

            loadOrders();

        }else{

            loginBox.style.display =
                "block";

            adminPanel.style.display =
                "none";

        }

    }
);



/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async function(){

        await signOut(auth);

    }
);



/* =========================
   REFRESH
========================= */

refreshBtn.addEventListener(
    "click",
    function(){

        loadOrders();

    }
);



/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    ordersList.innerHTML = `

        <div class="loading">
            جاري تحميل الطلبات... ⏳
        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "orders"
                )
            );


        ordersCount.innerText =
            snapshot.size;


        let sales =
            0;


        if(snapshot.empty){

            ordersList.innerHTML = `

                <div class="empty">
                    لا توجد طلبات حتى الآن 📦
                </div>

            `;

            salesTotal.innerText =
                "0 جنيه";

            return;

        }


        ordersList.innerHTML = "";


        snapshot.forEach(
            function(orderDoc){

                const order =
                    orderDoc.data();


                sales +=
                    Number(order.total) || 0;


                let productsHTML = "";


                if(
                    Array.isArray(
                        order.products
                    )
                ){

                    order.products.forEach(
                        function(product){

                            productsHTML += `

                                <div class="product">

                                    <span>
                                        ${product.name || "منتج"}
                                    </span>

                                    <strong>
                                        ${Number(product.price) || 0}
                                        جنيه
                                    </strong>

                                </div>

                            `;

                        }
                    );

                }


                let date = "";


                if(order.createdAt){

                    try{

                        date =
                            order.createdAt
                                .toDate()
                                .toLocaleString(
                                    "ar-EG"
                                );

                    }catch(e){

                        date = "";

                    }

                }


                const currentStatus =
                    order.status || "new";


                const orderElement =
                    document.createElement(
                        "div"
                    );


                orderElement.className =
                    "order";


                orderElement.innerHTML = `

                    <div class="order-header">

                        <div class="order-id">
                            📦 طلب #${orderDoc.id}
                        </div>

                        <div class="order-date">
                            ${date}
                        </div>

                    </div>


                    <div class="customer">

                        👤 الاسم:
                        ${order.name || "غير موجود"}

                        <br>

                        📱 الهاتف:
                        ${order.phone || "غير موجود"}

                        <br>

                        📍 العنوان:
                        ${order.address || "غير موجود"}

                    </div>


                    <div class="products">

                        ${productsHTML}

                    </div>


                    <div class="order-bottom">

                        <div class="total">

                            💰 ${Number(order.total) || 0}
                            جنيه

                        </div>

                    </div>


                    <div class="status-box">

                        <label class="status-label">
                            📌 حالة الطلب
                        </label>


                        <select
                            class="status-select"
                        >

                            <option
