<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الأدمن | SANDOQAK</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#090909;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

/* ================= LOGIN ================= */

.login-box{
    max-width:420px;
    margin:70px auto;
    background:#111;
    border:1px solid #252525;
    border-radius:20px;
    padding:25px;
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
    line-height:1.7;
}

.input-box{
    position:relative;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    background:#181818;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#00e5ff;
}

.password-input{
    padding-left:95px;
}

.show-password{
    position:absolute;
    left:7px;
    top:7px;
    height:34px;
    padding:0 10px;
    border:0;
    border-radius:8px;
    background:#333;
    color:white;
    cursor:pointer;
    font-size:13px;
    z-index:5;
}

.show-password:active{
    transform:scale(.96);
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.6;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#ff7777;
    line-height:1.6;
}

/* ================= ADMIN ================= */

#adminPanel{
    display:none;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#00e5ff;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-btn{
    border:0;
    border-radius:10px;
    padding:10px 14px;
    background:#00e5ff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.logout{
    background:#e53935;
    color:white;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:30px;
    margin-bottom:8px;
}

.title p{
    color:#aaa;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:20px;
}

.stat small{
    color:#aaa;
}

.stat h2{
    margin-top:10px;
    font-size:28px;
}

.orders{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:20px;
}

.orders-header{
    margin-bottom:20px;
}

.order{
    background:#181818;
    border:1px solid #292929;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.order-id{
    color:#00e5ff;
    font-weight:bold;
}

.customer{
    color:#ddd;
    line-height:2;
}

.products{
    border-top:1px solid #292929;
    border-bottom:1px solid #292929;
    margin:12px 0;
    padding:12px 0;
}

.product{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.delete{
    background:#e53935;
    color:white;
    border:0;
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
}

.empty,
.loading{
    text-align:center;
    padding:35px 10px;
    color:#aaa;
}

.error{
    background:#3a1111;
    border:1px solid #7a2222;
    color:#ffb3b3;
    padding:15px;
    border-radius:12px;
    line-height:1.7;
}

@media(max-width:600px){

    body{
        padding:12px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .header-buttons{
        width:100%;
    }

    .header-btn{
        flex:1;
    }

    .order-top{
        flex-direction:column;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- =========================
     LOGIN
========================= -->

<div
    class="login-box"
    id="loginBox"
>

    <h1>
        👑 SANDOQAK
    </h1>

    <p>
        لوحة الإدارة
        <br>
        سجل دخولك للمتابعة
    </p>


    <div class="input-box">

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email"
        >

    </div>


    <div class="input-box">

        <div style="position:relative;">

    <input
        type="password"
        id="password"
        class="password-input"
        placeholder="كلمة المرور"
        autocomplete="current-password"
        style="padding-left:90px;"
    >

    <button
        type="button"
        id="showPassword"
        onclick="
            const p = document.getElementById('password');
            const b = document.getElementById('showPassword');

            if (p.type === 'password') {
                p.type = 'text';
                b.innerHTML = '🙈 إخفاء';
            } else {
                p.type = 'password';
                b.innerHTML = '👁️ إظهار';
            }
        "
        style="
            position:absolute;
            left:7px;
            top:7px;
            height:34px;
            padding:0 10px;
            border:0;
            border-radius:8px;
            background:#333;
            color:white;
            cursor:pointer;
            z-index:10;
        "
    >
        👁️ إظهار
    </button>

</div>

        <button
    type="button"
    onclick="document.getElementById('password').type='text'"
    style="
        position:absolute;
        left:7px;
        top:7px;
        z-index:10;
        background:#333;
        color:white;
        border:0;
        padding:8px 10px;
        border-radius:8px;
    ">
    👁️ إظهار
</button>

    </div>


    <button
        type="button"
        class="login-btn"
        id="loginBtn"
    >
        تسجيل الدخول 🔐
    </button>


    <div
        class="message"
        id="loginMessage">
    </div>

</div>



<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">


<header>

    <div class="logo">
        SANDOQ<span>AK</span> 👑
    </div>


    <div class="header-buttons">

        <button
            type="button"
            class="header-btn"
            id="refreshBtn"
        >
            🔄 تحديث
        </button>


        <button
            type="button"
            class="header-btn logout"
            id="logoutBtn"
        >
            خروج
        </button>

    </div>

</header>



<div class="title">

    <h1>
        📦 لوحة الطلبات
    </h1>

    <p>
        الطلبات المسجلة في Firebase
    </p>

</div>



<div class="stats">


    <div class="stat">

        <small>
            📦 عدد الطلبات
        </small>

        <h2 id="ordersCount">
            0
        </h2>

    </div>


    <div class="stat">

        <small>
            💰 إجمالي المبيعات
