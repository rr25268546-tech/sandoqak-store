<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | SANDOQAK</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#090909;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.login-box{
    max-width:420px;
    margin:80px auto;
    background:#111;
    border:1px solid #252525;
    border-radius:20px;
    padding:25px;
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:#181818;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
}

input:focus{
    border-color:#00e5ff;
}

button{
    cursor:pointer;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
    font-weight:bold;
    font-size:16px;
}

.message{
    margin-top:15px;
    text-align:center;
    color:#ff7777;
    line-height:1.6;
}

#adminPanel{
    display:none;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:10px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#00e5ff;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-btn{
    padding:10px 14px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#000;
    font-weight:bold;
}

.logout{
    background:#e53935;
    color:white;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    margin-bottom:8px;
}

.title p{
    color:#aaa;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:20px;
}

.stat small{
    color:#aaa;
}

.stat h2{
    margin-top:10px;
    font-size:28px;
}

.orders{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:20px;
}

.orders-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.order{
    background:#181818;
    border:1px solid #292929;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.order-id{
    color:#00e5ff;
    font-weight:bold;
}

.customer{
    line-height:2;
    color:#ddd;
}

.products{
    border-top:1px solid #292929;
    border-bottom:1px solid #292929;
    padding:12px 0;
    margin:12px 0;
}

.product{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.delete{
    background:#e53935;
    color:white;
    border:0;
    padding:9px 14px;
    border-radius:9px;
}

.empty,
.loading{
    text-align:center;
    padding:35px 10px;
    color:#aaa;
}

.error{
    background:#3a1111;
    color:#ffb3b3;
    padding:15px;
    border-radius:12px;
    line-height:1.7;
}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    header{
        align-items:flex-start;
        flex-direction:column;
    }

    .order-top{
        flex-direction:column;
    }

    .orders-header{
        align-items:flex-start;
        flex-direction:column;
        gap:10px;
    }
}
</style>

</head>

<body>

<div class="container">

<!-- تسجيل الدخول -->

<div id="loginBox" class="login-box">

    <h1>👑 SANDOQAK</h1>

    <p>
        لوحة الإدارة
        <br>
        سجل دخولك للمتابعة
    </p>

    <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
    >

    <button
        class="login-btn"
        id="loginBtn"
    >
        تسجيل الدخول 🔐
    </button>

    <div
        class="message"
        id="loginMessage">
    </div>

</div>


<!-- لوحة الأدمن -->

<div id="adminPanel">

<header>

    <div class="logo">
        SANDOQ<span>AK</span> 👑
    </div>

    <div class="header-buttons">

        <button
            class="header-btn"
            onclick="loadOrders()">
            🔄 تحديث
        </button>

        <button
            class="header-btn logout"
            id="logoutBtn">
            خروج
        </button>

    </div>

</header>


<div class="title">

    <h1>📦 لوحة الطلبات</h1>

    <p>
        الطلبات المسجلة في Firebase
    </p>

</div>


<div class="stats">

    <div class="stat">

        <small>
            📦 عدد الطلبات
        </small>

        <h2 id="ordersCount">
            0
        </h2>

    </div>


    <div class="stat">

        <small>
            💰 إجمالي المبيعات
        </small>

        <h2 id="salesTotal">
            0 جنيه
        </h2>

    </div>

</div>


<div class="orders">

    <div class="orders-header">

        <h2>
            📋 الطلبات
        </h2>

    </div>

    <div id="ordersList">
        <div class="loading">
            جاري تحميل الطلبات... ⏳
        </div>
    </div>

</div>

</div>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/*
   نفس إعداد Firebase الموجود في firebase.js
*/

const firebaseConfig = {
    apiKey: "AIzaSyC3NvbBmiX-2nBBFw-X6KBkpU_8ZOQnDvQ",
    authDomain: "sandoqak-479c4.firebaseapp.com",
    projectId: "sandoqak-479c4",
    storageBucket: "sandoqak-479c4.firebasestorage.app",
    messagingSenderId: "295608980009",
    appId: "1:295608980009:web:f3176896d1b5f461c30238",
    measurementId: "G-JKLEMJK7ZQ"
};


const authApp =
    initializeApp(
        firebaseConfig,
        "adminAuthApp"
    );


const auth =
    getAuth(authApp);


const loginBox =
    document.getElementById("loginBox");

const adminPanel =
    document.getElementById("adminPanel");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginMessage =
    document.getElementById("loginMessage");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const ordersList =
    document.getElementById("ordersList");

const ordersCount =
    document.getElementById("ordersCount");

const salesTotal =
    document.getElementById("salesTotal");


/* تسجيل الدخول */

loginBtn.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(!email || !password){

            loginMessage.innerText =
                "اكتب الإيميل والباسورد أولًا.";

            return;
        }

        loginBtn.disabled = true;

        loginBtn.innerText =
            "جاري الدخول... ⏳";

        loginMessage.innerText = "";

        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }catch(error){

            console.error(error);

            loginMessage.innerText =
                "الإيميل أو كلمة المرور غير صحيحة.";

            loginBtn.disabled = false;

            loginBtn.innerText =
                "تسجيل الدخول 🔐";
        }
    }
);


/* مراقبة حالة المستخدم */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            loginBox.style.display =
                "none";

            adminPanel.style.display =
                "block";

            loadOrders();

        }else{

            loginBox.style.display =
                "block";

            adminPanel.style.display =
                "none";
        }
    }
);


/* تسجيل الخروج */

logoutBtn.addEventListener(
    "click",
    async function(){

        await signOut(auth);

    }
);


/* تحميل الطلبات */

async function loadOrders(){

    ordersList.innerHTML = `
        <div class="loading">
            جاري تحميل الطلبات... ⏳
        </div>
    `;

    try{

        const snapshot =
            await getDocs(
                collection(db,"orders")
            );

        ordersCount.innerText =
            snapshot.size;

        let totalSales = 0;

        if(snapshot.empty){

            ordersList.innerHTML = `
                <div class="empty">
                    لا توجد طلبات حتى الآن 📦
                </div>
            `;

            salesTotal.innerText =
                "0 جنيه";

            return;
        }

        ordersList.innerHTML = "";

        snapshot.forEach(
            function(orderDoc){

                const order =
                    orderDoc.data();

                totalSales +=
                    Number(order.total) || 0;


                let productsHTML = "";

                if(Array.isArray(order.products)){

                    order.products.forEach(
                        function(product){

                            productsHTML += `
                                <div class="product">

                                    <span>
                                        ${product.name}
                                    </span>

                                    <strong>
                                        ${product.price} جنيه
                                    </strong>

                                </div>
                            `;

                        }
                    );
                }


                let date = "";

                if(order.createdAt){

                    try{

                        date =
                            order.createdAt
                            .toDate()
                            .toLocaleString("ar-EG");

                    }catch(e){

                        date = "";

                    }
                }


                const element =
                    document.createElement("div");

                element.className =
                    "order";


                element.innerHTML = `

                    <div class="order-top">

                        <div class="order-id">
                            طلب #${orderDoc.id}
                        </div>

                        <div>
                            ${date}
                        </div>

                    </div>


                    <div class="customer">

                        👤 الاسم:
                        ${order.name || "غير موجود"}

                        <br>

                        📱 الهاتف:
                        ${order.phone || "غير موجود"}

                        <br>

                        📍 العنوان:
                        ${order.address || "غير موجود"}

                    </div>


                    <div class="products">

                        ${productsHTML}

                    </div>


                    <div class="total">

                        💰 الإجمالي:
                        ${order.total || 0}
                        جنيه

                    </div>


                    <button
                        class="delete"
                        data-id="${orderDoc.id}">

                        🗑️ حذف الطلب

                    </button>

                `;


                element
                .querySelector(".delete")
                .addEventListener(
                    "click",
                    function(){

                        deleteOrder(
                            orderDoc.id
                        );

                    }
                );


                ordersList.appendChild(
                    element
                );

            }
        );


        salesTotal.innerText =
            totalSales + " جنيه";

    }catch(error){

        console.error(error);

        ordersList.innerHTML = `
            <div class="error">

                ❌ حصل خطأ في تحميل الطلبات.

                <br><br>

                ${error.message}

            </div>
        `;

    }
}


/* حذف طلب */

async function deleteOrder(id){

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف الطلب؟"
        );

    if(!confirmed){
        return;
    }

    try{

        await deleteDoc(
            doc(db,"orders",id)
        );

        await loadOrders();

    }catch(error){

        alert(
            "حصل خطأ أثناء حذف الطلب:\n" +
            error.message
        );

    }
}


window.loadOrders =
    loadOrders;

</script>

</body>

</html>
